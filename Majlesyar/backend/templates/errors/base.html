<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ status_code }} | مجلس یار</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf7ef;
      --ink: #1f2937;
      --muted: #64748b;
      --card: #ffffff;
      --gold: #b8872f;
      --teal: #0f766e;
      --line: #eadfce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(184, 135, 47, .18), transparent 34rem),
        linear-gradient(135deg, #fffaf2, var(--bg));
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(31, 41, 55, .12);
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      height: 56px;
      border-radius: 999px;
      background: #fff3dc;
      color: #8a5a10;
      font-size: 30px;
      font-weight: 800;
      border: 1px solid #f2d8a8;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.45;
    }
    p {
      margin: 0 auto 16px;
      max-width: 52ch;
      color: var(--muted);
      font-size: 17px;
      line-height: 2;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    a:hover { transform: translateY(-1px); }
    .primary {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 10px 24px rgba(184, 135, 47, .22);
    }
    .secondary {
      color: var(--teal);
      border: 1px solid #b7d9d5;
      background: #effbf9;
    }
    .hint {
      margin-top: 26px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">{{ status_code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="actions">
      <a class="primary" href="/">بازگشت به صفحه اصلی</a>
      <a class="secondary" href="/pack">پک میوه و پذیرایی</a>
      <a class="secondary" href="/pack/memorial">پک‌های ترحیم و ختم</a>
      <a class="secondary" href="/halva-khorma">حلوا خرما و خرما گردو</a>
      <a class="secondary" href="/flower">گل و گل‌آرایی</a>
      <a class="secondary" href="/food/finger_food">فینگر فود</a>
      <a class="secondary" href="/builder">ساخت پک اختصاصی</a>
      <a class="secondary" href="/contact">تماس با مجلس یار</a>
    </div>
    <div class="hint">{{ hint }}</div>
  </main>
</body>
</html>
