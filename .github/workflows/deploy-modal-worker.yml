name: Deploy Modal 3D worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-modal-3d-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PRODUCT_3D_GENERATOR_TOKEN: ${{ secrets.PRODUCT_3D_GENERATOR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: python -m pip install "modal==1.5.5"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          test -n "$PRODUCT_3D_GENERATOR_TOKEN"

      - name: Configure worker authentication
        run: >-
          modal secret create majlesyar-3d-worker
          PRODUCT_3D_GENERATOR_TOKEN="$PRODUCT_3D_GENERATOR_TOKEN"
          --force

      - name: Deploy worker
        run: modal deploy Majlesyar/ml_worker/modal_app.py
